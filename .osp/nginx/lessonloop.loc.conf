# LessonLoop: nginx settings inside Open Server Panel 6's server block.
# backend/public holds the API (index.php), admin/ and board/ (built by
# deploy\build.bat) and docs/; everything else goes to Laravel.

index                index.php index.html;
client_max_body_size 20m;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Reverb (board updates) through this same port: the board connects to
# ws://<server>:8000/app/..., so no second port has to be reachable.
location ~ ^/(app|apps)/ {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host       $host;
    proxy_read_timeout 1h;
}

# Built files have hashed names and never change.
location ~ ^/(admin|board)/assets/ {
    expires 30d;
}

location ~ \.php$ {
    fastcgi_pass $backend_ip:$backend_port;
    try_files    $fastcgi_script_name =404;
    include      fastcgi.conf;
}

location ~ /\.(?!well-known) {
    deny all;
}
