openapi: 3.0.3
info:
  title: 'LessonLoop API'
  description: "O'qituvchi telefoni, sinf doskasi va admin panel ishlatadigan API."
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Bosh sahifa'
    description: ''
  -
    name: Darslar
    description: ''
  -
    name: 'Doska va pult'
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: 'Fanlar va mavzular'
    description: ''
  -
    name: Foydalanuvchilar
    description: ''
  -
    name: 'Guruhlar va talabalar'
    description: ''
  -
    name: Import
    description: ''
  -
    name: 'Jurnal va hisobotlar'
    description: ''
  -
    name: Kirish
    description: ''
  -
    name: Kurslar
    description: ''
  -
    name: Savollar
    description: ''
  -
    name: Sozlamalar
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Token `POST /api/login` javobida keladi (`token`). Doska endpointlari (login yo'q) belgilab qo'yilgan."
security:
  -
    default: []
paths:
  /api/dashboard:
    get:
      summary: ''
      operationId: getApiDashboard
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Bosh sahifa'
  /api/lessons:
    get:
      summary: "Lesson history of the user's courses, newest first."
      operationId: lessonHistoryOfTheUsersCoursesNewestFirst
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                course_id:
                  type: integer
                  description: ''
                  example: 16
                status:
                  type: string
                  description: ''
                  example: paused
                  enum:
                    - active
                    - paused
                    - finished
                from:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-20T11:11:13'
                to:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-20T11:11:13'
  '/api/courses/{course_id}/lessons':
    post:
      summary: ''
      operationId: postApiCoursesCourse_idLessons
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - 16
                  items:
                    type: integer
                question_count:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 22
                absent_student_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - 16
                  items:
                    type: integer
              required:
                - question_count
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/lessons/{id}':
    get:
      summary: ''
      operationId: getApiLessonsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the lesson.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/lessons/{lesson_id}/draw':
    post:
      summary: ''
      operationId: postApiLessonsLesson_idDraw
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
    parameters:
      -
        in: path
        name: lesson_id
        description: 'The ID of the lesson.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/lessons/{lesson_id}/finish':
    post:
      summary: ''
      operationId: postApiLessonsLesson_idFinish
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
    parameters:
      -
        in: path
        name: lesson_id
        description: 'The ID of the lesson.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/answers/{answer_id}/grade':
    post:
      summary: ''
      operationId: postApiAnswersAnswer_idGrade
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                  description: 'This field is required when <code>chosen_option</code> is not present. Must be at least 0. Must not be greater than 100.'
                  example: 1
                  nullable: true
                chosen_option:
                  type: string
                  description: ''
                  example: B
                  enum:
                    - A
                    - B
                    - C
                    - D
                  nullable: true
                comment:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: 'n'
                  nullable: true
                client_uuid:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                  nullable: true
    parameters:
      -
        in: path
        name: answer_id
        description: 'The ID of the answer.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/answers/{id}':
    patch:
      summary: 'Change a grade after the lesson, with a reason that is kept in the history.'
      operationId: changeAGradeAfterTheLessonWithAReasonThatIsKeptInTheHistory
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 100.'
                  example: 1
                reason:
                  type: string
                  description: 'Must be at least 3 characters. Must not be greater than 255 characters.'
                  example: 'n'
              required:
                - score
                - reason
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the answer.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/answers/{answer_id}/skip':
    post:
      summary: ''
      operationId: postApiAnswersAnswer_idSkip
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: ''
                  example: absent
                  enum:
                    - no_answer
                    - absent
                comment:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: b
                  nullable: true
                client_uuid:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: a4855dc5-0acb-33c3-b921-f4291f719ca0
                  nullable: true
              required:
                - reason
    parameters:
      -
        in: path
        name: answer_id
        description: 'The ID of the answer.'
        example: 16
        required: true
        schema:
          type: integer
  /api/sync:
    post:
      summary: ''
      operationId: postApiSync
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operations:
                  type: array
                  description: 'Must have at least 1 items. Must not have more than 200 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      client_uuid:
                        type: string
                        description: 'Must be a valid UUID.'
                        example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                      type:
                        type: string
                        description: ''
                        example: grade
                        enum:
                          - grade
                          - skip
                      answer_id:
                        type: integer
                        description: ''
                        example: 16
                      score:
                        type: integer
                        description: 'Must be at least 0. Must not be greater than 100.'
                        example: 22
                        nullable: true
                      chosen_option:
                        type: string
                        description: ''
                        example: A
                        enum:
                          - A
                          - B
                          - C
                          - D
                        nullable: true
                      comment:
                        type: string
                        description: 'Must not be greater than 1000 characters.'
                        example: g
                        nullable: true
                      reason:
                        type: string
                        description: 'This field is required when <code>operations.*.type</code> is <code>skip</code>.'
                        example: absent
                        enum:
                          - no_answer
                          - absent
                        nullable: true
                      performed_at:
                        type: string
                        description: 'Must be a valid date.'
                        example: '2026-10-20T11:11:13'
                        nullable: true
                    required:
                      - client_uuid
                      - type
                      - answer_id
              required:
                - operations
  '/api/answers/{answer_id}/redraw':
    post:
      summary: ''
      operationId: postApiAnswersAnswer_idRedraw
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Darslar
    parameters:
      -
        in: path
        name: answer_id
        description: 'The ID of the answer.'
        example: 16
        required: true
        schema:
          type: integer
  /api/boards:
    post:
      summary: 'A board browser tab opens a new session and gets its token and pair code.'
      operationId: aBoardBrowserTabOpensANewSessionAndGetsItsTokenAndPairCode
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: true
      security: []
  '/api/boards/{token}/state':
    get:
      summary: 'Current board state, used by the board after a reload or reconnect.'
      operationId: currentBoardStateUsedByTheBoardAfterAReloadOrReconnect
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
      security: []
    parameters:
      -
        in: path
        name: token
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  '/api/boards/{token}/pair-code':
    post:
      summary: ''
      operationId: postApiBoardsTokenPairCode
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
      security: []
    parameters:
      -
        in: path
        name: token
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/boards/pair:
    post:
      summary: ''
      operationId: postApiBoardsPair
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Must be 6 digits.'
                  example: '569775'
              required:
                - code
  '/api/boards/{board_id}/controller-state':
    get:
      summary: 'The controlling phone restores its board after an app restart.'
      operationId: theControllingPhoneRestoresItsBoardAfterAnAppRestart
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
    parameters:
      -
        in: path
        name: board_id
        description: 'The ID of the board.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/boards/{board_id}/heartbeat':
    post:
      summary: 'Sent by the controlling phone every ~15 seconds while it is paired.'
      operationId: sentByTheControllingPhoneEvery15SecondsWhileItIsPaired
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
    parameters:
      -
        in: path
        name: board_id
        description: 'The ID of the board.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/boards/{board_id}/lesson':
    post:
      summary: ''
      operationId: postApiBoardsBoard_idLesson
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lesson_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
              required:
                - lesson_id
    parameters:
      -
        in: path
        name: board_id
        description: 'The ID of the board.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/boards/{board_id}/commands':
    post:
      summary: ''
      operationId: postApiBoardsBoard_idCommands
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: ''
                  example: show_question
                  enum:
                    - show_lobby
                    - draw
                    - redraw
                    - show_question
                    - reveal_answer
                    - hide_answer
                    - show_score
                    - finish
                    - blackout
                    - pause
                    - resume
              required:
                - command
    parameters:
      -
        in: path
        name: board_id
        description: 'The ID of the board.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/boards/{board_id}/options':
    patch:
      summary: ''
      operationId: patchApiBoardsBoard_idOptions
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                show_student_name:
                  type: boolean
                  description: ''
                  example: true
                show_score:
                  type: boolean
                  description: ''
                  example: false
                show_answer:
                  type: boolean
                  description: ''
                  example: true
                timer_seconds:
                  type: integer
                  description: 'Must be at least 10. Must not be greater than 600.'
                  example: 1
                  nullable: true
    parameters:
      -
        in: path
        name: board_id
        description: 'The ID of the board.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/boards/{board_id}/takeover-code':
    post:
      summary: ''
      operationId: postApiBoardsBoard_idTakeoverCode
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
    parameters:
      -
        in: path
        name: board_id
        description: 'The ID of the board.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/boards/{board_id}/controller':
    delete:
      summary: ''
      operationId: deleteApiBoardsBoard_idController
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Doska va pult'
    parameters:
      -
        in: path
        name: board_id
        description: 'The ID of the board.'
        example: 16
        required: true
        schema:
          type: integer
  /api/broadcasting/auth:
    get:
      summary: 'Authenticate the request for channel access.'
      operationId: authenticateTheRequestForChannelAccess
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
  /api/subjects:
    get:
      summary: 'Admins see every subject, teachers only the subjects of their courses.'
      operationId: adminsSeeEverySubjectTeachersOnlyTheSubjectsOfTheirCourses
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
    post:
      summary: ''
      operationId: postApiSubjects
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                code:
                  type: string
                  description: 'Must not be greater than 32 characters.'
                  example: 'n'
                  nullable: true
              required:
                - name
  '/api/subjects/{id}':
    get:
      summary: ''
      operationId: getApiSubjectsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
    put:
      summary: ''
      operationId: putApiSubjectsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                code:
                  type: string
                  description: 'Must not be greater than 32 characters.'
                  example: 'n'
                  nullable: true
              required:
                - name
    delete:
      summary: ''
      operationId: deleteApiSubjectsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the subject.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/subjects/{subject_id}/topics/order':
    patch:
      summary: 'Save a new order of the subject topics; positions follow the given ids.'
      operationId: saveANewOrderOfTheSubjectTopicsPositionsFollowTheGivenIds
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                topic_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - 16
                  items:
                    type: integer
    parameters:
      -
        in: path
        name: subject_id
        description: 'The ID of the subject.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/subjects/{subject_id}/topics':
    get:
      summary: ''
      operationId: getApiSubjectsSubject_idTopics
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
    post:
      summary: ''
      operationId: postApiSubjectsSubject_idTopics
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                position:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 1000.'
                  example: 22
              required:
                - title
    parameters:
      -
        in: path
        name: subject_id
        description: 'The ID of the subject.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/topics/{id}':
    get:
      summary: ''
      operationId: getApiTopicsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
    put:
      summary: ''
      operationId: putApiTopicsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                position:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 1000.'
                  example: 22
              required:
                - title
    delete:
      summary: ''
      operationId: deleteApiTopicsId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Fanlar va mavzular'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the topic.'
        example: 16
        required: true
        schema:
          type: integer
  /api/users:
    get:
      summary: ''
      operationId: getApiUsers
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Foydalanuvchilar
    post:
      summary: ''
      operationId: postApiUsers
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Foydalanuvchilar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                login:
                  type: string
                  description: 'Must match the regex /^[a-z0-9._-]+$/. Must be at least 3 characters. Must not be greater than 50 characters.'
                  example: 'n'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: ashly64@example.com
                  nullable: true
                role:
                  type: string
                  description: ''
                  example: admin
                  enum:
                    - admin
                    - teacher
                password:
                  type: string
                  description: 'Must be at least 8 characters. Must not be greater than 255 characters.'
                  example: pBNvYg
                blocked:
                  type: boolean
                  description: ''
                  example: false
              required:
                - name
                - login
  '/api/users/{id}':
    get:
      summary: ''
      operationId: getApiUsersId
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Foydalanuvchilar
    put:
      summary: 'Blocking an account also signs it out of every device.'
      operationId: blockingAnAccountAlsoSignsItOutOfEveryDevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Foydalanuvchilar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                login:
                  type: string
                  description: 'Must match the regex /^[a-z0-9._-]+$/. Must be at least 3 characters. Must not be greater than 50 characters.'
                  example: 'n'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: ashly64@example.com
                  nullable: true
                role:
                  type: string
                  description: ''
                  example: admin
                  enum:
                    - admin
                    - teacher
                password:
                  type: string
                  description: 'Must be at least 8 characters. Must not be greater than 255 characters.'
                  example: pBNvYg
                blocked:
                  type: boolean
                  description: ''
                  example: false
              required:
                - name
                - login
    delete:
      summary: 'Accounts that ran lessons are kept for the record; block them instead.'
      operationId: accountsThatRanLessonsAreKeptForTheRecordBlockThemInstead
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Foydalanuvchilar
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the user.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/users/{user_id}/reset-password':
    post:
      summary: 'Give the user a new temporary password and sign them out everywhere.'
      operationId: giveTheUserANewTemporaryPasswordAndSignThemOutEverywhere
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Foydalanuvchilar
    parameters:
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 16
        required: true
        schema:
          type: integer
  /api/groups:
    get:
      summary: 'Admins see every group, teachers only the groups of their courses.'
      operationId: adminsSeeEveryGroupTeachersOnlyTheGroupsOfTheirCourses
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Guruhlar va talabalar'
    post:
      summary: ''
      operationId: postApiGroups
      description: ''
      parameters: []
      responses: {  }
